services:
  gbbot:
    build: .
    environment:
      - BOT_TOKEN=${GB_BOT_TOKEN}
      - PARSE_URL=${GB_PARSE_URL}
      - PARSE_INTERVAL=${PARSE_INTERVAL}
      - DIFFERENCE_THRESHOLD=${DIFFERENCE_THRESHOLD}
    restart: always

  bbot:
    build: .
    environment:
      - BOT_TOKEN=${BB_BOT_TOKEN}
      - PARSE_URL=${BB_PARSE_URL}
      - PARSE_INTERVAL=${PARSE_INTERVAL}
      - DIFFERENCE_THRESHOLD=${DIFFERENCE_THRESHOLD}
    restart: always
